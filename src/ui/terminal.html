<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terminal Tools</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="./terminal.css" />
</head>
<body>
  <main class="terminal-page container-fluid py-3 py-lg-4">
    <section class="terminal-shell mx-auto">
      <header class="terminal-topbar">
        <div class="title-wrap">
          <span class="dot red"></span>
          <span class="dot yellow"></span>
          <span class="dot green"></span>
          <h1 class="terminal-title">FF Debugger Terminal</h1>
        </div>

        <div class="help-buttons">
          <button id="btn-start-listener" class="btn btn-success btn-sm" type="button">Start Listener</button>
          <button id="btn-stop-listener" class="btn btn-danger btn-sm" type="button">Stop Listener</button>
          <button id="btn-kill-listener" class="btn btn-outline-danger btn-sm" type="button">Kill Terminal</button>
          <button id="btn-back" class="btn btn-outline-light btn-sm" type="button">Quay lại</button>
        </div>
      </header>

      <section id="panel-terminal" class="tab-panel active" role="tabpanel">
        <div class="session-meta" id="sessionMeta">Session: -</div>

        <div id="terminalOutput" class="terminal-output" aria-live="polite"></div>
      </section>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./terminal.js"></script>
</body>
</html>
